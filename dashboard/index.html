<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에이전트 대시보드</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark' } catch (e) {}</script>
<style>
:root {
  --bg: #1A1918; --panel: #201F1D; --raise: #2A2927; --hover: rgba(156,154,146,.10);
  --line: rgba(240,238,230,.10); --line2: rgba(240,238,230,.24);
  --text: #F0EEE6; --muted: #B0AEA5; --faint: #8A8982;
  --ok: #7DBB86; --ok-tint: rgba(125,187,134,.12);
  --clay: #D97757; --clay-ink: #E8957A; --clay-tint: rgba(217,119,87,.12); --clay-line: rgba(217,119,87,.50);
  --term: #141413;
  --sans: 'Wanted Sans Variable', 'Wanted Sans', system-ui, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --mono: 'Anthropic Mono', 'JetBrains Mono', 'SF Mono', 'D2Coding', Monaco, 'Courier New', monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #FAF9F5; --panel: #FFFFFF; --raise: #F0EEE6; --hover: rgba(115,114,108,.10);
  --line: rgba(31,30,29,.12); --line2: rgba(31,30,29,.28);
  --text: #141413; --muted: #5E5D59; --faint: #7A7972;
  --ok: #2F7A45; --ok-tint: rgba(47,122,69,.10);
  --clay-ink: #B4552F; --clay-tint: rgba(217,119,87,.10); --clay-line: rgba(217,119,87,.55);
  color-scheme: light;
}
@font-face {
  font-family: 'Wanted Sans Variable'; font-style: normal; font-weight: 400 1000; font-display: swap;
  src: url('/vendor/WantedSansVariable.woff2') format('woff2');
}
* { box-sizing: border-box }
html, body { height: 100% }
body {
  margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
  font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer }
a { color: inherit; text-decoration: none }
:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; border-radius: 8px }
time, .num, .meta, .chip, .count { font-variant-numeric: tabular-nums }
.mono { font-family: var(--mono); font-size: 11.5px }

/* top bar (outside the scroll box, so it stays put) */
#top {
  flex: none; display: flex; align-items: center; gap: 8px; height: 60px; padding: 0 20px;
  border-bottom: 1px solid var(--line); background: var(--bg);
}
#top h1 { margin: 0; font: 700 20px/1 var(--sans); letter-spacing: -.01em; white-space: nowrap }
.back, .theme, .notif {
  display: inline-flex; align-items: center; justify-content: center; height: 32px; border-radius: 8px;
  color: var(--muted); border: 1px solid var(--line)
}
.notif { flex: none; gap: 6px; padding: 0 10px; font-size: 13px; font-weight: 500; white-space: nowrap }
.notif:hover { background: var(--hover); color: var(--text) }
.notif[aria-pressed="true"] { border-color: transparent; background: var(--ok-tint); color: var(--ok) }
.notif:disabled { cursor: default; opacity: .6 }
.notif svg { flex: none }
@media (max-width: 620px) { .notif { width: 32px; padding: 0 } .notif .lbl { display: none } }
.back { gap: 4px; padding: 0 12px 0 8px; font-weight: 500 }
.theme { width: 32px; flex: none }
.back:hover, .theme:hover { background: var(--hover); color: var(--text) }
.counts { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end }
.count { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; color: var(--muted); background: var(--raise); font-size: 13px; white-space: nowrap }
.count.ok { background: var(--ok-tint); color: var(--ok) }
.count.ok b { color: var(--ok) }
.count b { font-weight: 600; color: var(--text) }
.count.blocked { background: var(--clay-tint); color: var(--clay-ink) }
.count.blocked b { color: var(--clay-ink) }

#view { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 820px; margin: 0 auto }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 20px 48px }
.banner { margin: 16px 0; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--clay-line); background: var(--clay-tint) }
.empty { padding: 40px 8px; color: var(--faint); text-align: center }

/* sections */
.sec-h {
  position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 24px 0 10px; background: var(--bg); text-align: left
}
.sec-h h2 { margin: 0; font: 700 15px/1.4 var(--sans); color: var(--text); letter-spacing: -.005em }
.sec-h h2::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 99px; background: var(--faint) }
[data-sec="busy"] .sec-h h2::before { background: var(--ok) }
[data-sec="wait"] .sec-h h2::before, [data-sec="now"] .sec-h h2::before { background: var(--clay) }
.sec-h .num { min-width: 24px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--raise); text-align: center; font-size: 12.5px; line-height: 22px; font-weight: 600; color: var(--muted) }
.sec-h .chev { margin-left: auto; color: var(--faint); font-size: 12px }
button.sec-h:hover h2 { color: var(--text) }
.sec-empty { padding: 4px 0 12px; font-size: 14px; color: var(--faint) }

/* status chip */
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
  border-radius: 999px; background: var(--raise); color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap
}
.dot { width: 6px; height: 6px; border-radius: 99px; flex: none; box-shadow: inset 0 0 0 1.5px currentColor }
.chip.busy { background: var(--ok-tint); color: var(--ok) }
.chip.busy .dot { background: currentColor; animation: pulse 1.6s ease-in-out infinite }
.chip.blocked { background: var(--clay-tint); color: var(--clay-ink) }
.chip.blocked .dot { background: var(--clay) ; box-shadow: none }
.chip.done { background: none; color: var(--faint); box-shadow: inset 0 0 0 1px var(--line) }
.chip.done .dot { background: currentColor; box-shadow: none; opacity: .6 }
@keyframes pulse { 50% { opacity: .3 } }
@media (prefers-reduced-motion: reduce) { .chip.busy .dot { animation: none } }

/* resident = lane badge on a filled card; task = job id badge on a dashed, unfilled card */
.badge { flex: none; display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; white-space: nowrap }
.badge.lane { background: var(--raise); color: var(--muted); font-weight: 600; letter-spacing: .02em }
.badge.task { border: 1px dashed var(--line2); color: var(--text); font: 500 12px/20px var(--mono) }
.badge.codex { border: 1px solid var(--line2); color: var(--muted); font: 600 12px/20px var(--mono) }

/* list */
.agent {
  position: relative; display: block; padding: 0; margin-bottom: 12px; overflow: hidden;
  border-radius: 14px; border: 1px solid var(--line); background: var(--panel)
}
.agent::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line2) }
.agent.busy::before { background: var(--ok) }
.agent.blocked::before { background: var(--clay) }
.agent.done::before { background: var(--line) }
.agent:hover { border-color: var(--line2) }
.agent.g-task { background: transparent; border-style: dashed; border-color: var(--line2) }
.agent.blocked { border-color: var(--clay-line) }
.agent.done { opacity: .78 }
.amain { display: block; padding: 16px 20px 16px 24px }
.amain:hover .name { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px }
.dec, .todo { padding: 16px 20px 16px 24px }
.r1 { display: flex; align-items: center; gap: 8px; min-width: 0 }
.name { flex: 0 1 auto; min-width: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.r1 .chip { margin-left: auto }
.why { margin-top: 8px; font-size: 14.5px; line-height: 1.6; color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden }
.agent.blocked .why, .agent.busy .why { color: var(--text) }
.needs { margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: var(--clay-tint); font-size: 14px; color: var(--clay-ink); overflow-wrap: anywhere }
.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; margin-top: 12px; font-size: 13px; color: var(--muted) }
.meta span { white-space: nowrap }
.meta b { font-weight: 600; color: var(--text) }

/* sub-agents: a fold under the card (outside the link) */
.subs { border-top: 1px solid var(--line) }
.subs-t { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 20px 10px 24px; text-align: left; font-size: 13.5px; color: var(--muted) }
.subs-t:hover { background: var(--hover); color: var(--text) }
.subs-t b { font-weight: 700; color: var(--text) }
.subs-t .run { color: var(--ok); font-weight: 600 }
.subs-t .chev { margin-left: auto; color: var(--faint); font-size: 12.5px }
.sublist { margin: 0; padding: 0 20px 14px 24px; list-style: none; display: grid; gap: 6px }
.sub { display: grid; grid-template-columns: auto 1fr auto; align-items: start; gap: 4px 10px; padding: 10px 12px; border-radius: 10px; background: var(--raise) }
.sub .dot { margin-top: 8px; color: var(--faint) }
.sub.busy .dot { color: var(--ok); background: currentColor; animation: pulse 1.6s ease-in-out infinite }
.sub.done .dot { background: currentColor; opacity: .5; box-shadow: none }
.sub.idle .dot { color: var(--clay) }
.sub .sd { min-width: 0; overflow-wrap: anywhere; font-size: 14px; color: var(--text) }
.sub .st { font: 500 11.5px/1.5 var(--mono); color: var(--muted); margin-right: 8px }
.sub time { font-size: 12.5px; color: var(--faint); white-space: nowrap }
.sub .sl { grid-column: 2 / 4; font-size: 12.5px; color: var(--faint) }

/* detail */
.dhead { flex: none; padding: 16px 16px 0 }
.dtitle { display: flex; align-items: center; gap: 8px; min-width: 0 }
.dtitle h2 { margin: 0; min-width: 0; font: 650 20px/1.3 var(--sans); letter-spacing: -.01em; overflow-wrap: anywhere }
.dtitle .chip { margin-left: auto }
.dcwd { margin-top: 4px; font: 12px/1.4 var(--mono); color: var(--faint); overflow-wrap: anywhere }
.dhead .why { display: block; -webkit-line-clamp: unset; margin-top: 8px }
.cmds { display: flex; flex-direction: column; gap: 4px; margin-top: 12px }
.cmd { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px 4px 4px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel) }
.cmd code { flex: 1; min-width: 0; font: 12px/1.4 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.cmd button { flex: none; height: 28px; padding: 0 12px; border-radius: 6px; background: var(--raise); font-size: 12px; font-weight: 500 }
.cmd button:hover { background: var(--hover) }
.hint { font-size: 12px; color: var(--faint) }
.tabs { display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--line) }
.tab { height: 46px; padding: 0 16px; font-size: 15px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px }
.tab:hover:not(:disabled) { color: var(--text) }
.tab[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--text) }
.tab:disabled { color: var(--faint); cursor: default }

/* feed */
.note-top { margin: 16px 0 0; font-size: 12px; color: var(--faint); text-align: center }
.ev { margin-top: 16px }
.who { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--faint); margin-bottom: 4px }
.who b { font-weight: 600; color: var(--muted) }
.who time { margin-left: auto }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px }
.txt.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 8; overflow: hidden }
.more { margin-top: 4px; font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px }
.user .txt { padding: 8px 12px; border-radius: 12px; background: var(--raise) }
.user .who b { color: var(--text) }
.peer .txt, .send .txt { padding: 8px 12px; border-left: 2px solid var(--line2); background: var(--panel); border-radius: 0 8px 8px 0; font-size: 13.5px }
.send .sum { margin-bottom: 4px; font-size: 13.5px; font-weight: 500 }
.note { margin-top: 12px; font-size: 12px; color: var(--faint); text-align: center }
.tool { margin-top: 4px }
.reply + .tool, .user + .tool, .peer + .tool, .send + .tool, .note + .tool { margin-top: 12px }
.thead { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; padding: 4px 8px; border-radius: 8px; text-align: left; color: var(--muted); font-size: 12.5px }
.thead:hover { background: var(--hover) }
.mark { width: 12px; flex: none; text-align: center; color: var(--faint) }
.mark.ok { color: var(--muted) }
.mark.err { color: var(--clay-ink) }
.tname { flex: none; font: 500 12px/1.4 var(--mono); color: var(--text) }
.tsum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.thead time { flex: none; color: var(--faint); font-size: 11.5px }
.tbody { margin: 4px 0 8px 28px; display: grid; gap: 4px }
.tbody[hidden] { display: none }
.tbody pre { margin: 0; padding: 8px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font: 11.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow-y: auto; color: var(--muted) }
.tbody pre.err { border-color: var(--clay-line) }

/* session window */
/* a ~200-column TUI does not fit 600px legibly: below 7px the box scrolls sideways, the page never does */
.termwrap { margin-top: 16px; border-radius: 12px; background: var(--term); border: 1px solid var(--line); padding: 8px; overflow-x: auto }
.term { overflow: hidden }
.term .xterm-viewport { overflow: hidden !important; background: var(--term) !important }
.tnote { margin: 8px 0 0; font-size: 12px; color: var(--faint) }


/* session window, portrait view */
.seg { position: sticky; top: 8px; z-index: 2; display: inline-flex; gap: 2px; margin-top: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.25); padding: 3px; border-radius: 10px; background: var(--raise) }
.segb { height: 32px; padding: 0 14px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--muted) }
.segb:hover { color: var(--text) }
.segb[aria-pressed="true"] { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--line) }
.logflow { margin-top: 12px; padding: 14px 16px; border-radius: 12px; background: var(--term); border: 1px solid var(--line); color: #E8E6DC; font: 13.5px/1.6 var(--mono) }
.logflow[hidden] { display: none }
.ll { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.6em }
.ll.gap { min-height: .6em }
.ll.sep { min-height: 0; margin: 8px 0; border-top: 1px solid rgba(240,238,230,.14) }
.ll.bul { margin-top: 10px; font-weight: 600; color: #F6F4EC }
.ll.res { color: #B0AEA5 }
.ll.prm { color: #E8957A }
.termwrap.off { height: 0; margin: 0; padding: 0; border: 0; overflow: hidden; visibility: hidden }

/* usage bar: remaining rate limit per engine, on every page */
#usage { flex: none; display: flex; flex-wrap: wrap; gap: 6px 28px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 13px; color: var(--faint) }
.use { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px }
.use > b { font-weight: 700; color: var(--text); font-size: 14px }
.win { display: inline-flex; align-items: center; gap: 8px; min-height: 24px }
.win .wn { color: var(--muted) }
.win b { font-weight: 700; color: var(--text) }
.win .bar { position: relative; width: 56px; height: 6px; border-radius: 99px; background: var(--raise); overflow: hidden }
.win .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--ok) }
.win.low .bar i { background: var(--clay) }
.win.low { padding: 0 10px; border-radius: 999px; background: var(--clay-tint); color: var(--clay-ink) }
.win.low b, .win.low .wn { color: var(--clay-ink) }
.use .ago { color: var(--faint); font-size: 12.5px }
.use.stale, .use.missing, .use.broken { opacity: .6 }

/* dev occupancy: who holds the dev stack, one thin line under the usage bar */
#dev { flex: none; display: flex; align-items: flex-start; gap: 4px 12px; padding: 6px 20px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 13px; color: var(--muted) }
#dev[hidden] { display: none }
#dev > b { flex: none; font-weight: 700; color: var(--text); line-height: 26px }
#dev.stale { opacity: .6 }
.devl { flex: 1; min-width: 0; display: grid; gap: 2px }
.devi { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 26px }
.devi b { flex: none; font-weight: 600; color: var(--text) }
.devi .dw { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.devi .num { flex: none; margin-left: auto; color: var(--faint) }
.devi.restart { padding: 0 10px; border-radius: 999px; background: var(--clay-tint); color: var(--clay-ink) }
.devi.restart b, .devi.restart .num { color: var(--clay-ink) }
.devi .kd { flex: none; font-weight: 600 }
#dev .more { flex: none; margin: 0; line-height: 26px }
#dev .ago { flex: none; color: var(--faint); line-height: 26px }

/* page tabs: 에이전트 / 결정 / 현황 */
#nav { flex: none; padding: 0 20px; border-bottom: 1px solid var(--line) }
#nav[hidden] { display: none }
#nav .tabs { margin: 0; border: 0; max-width: 780px; margin: 0 auto }
.tab .num { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--clay-tint); color: var(--clay-ink); font-size: 12px; font-weight: 600 }
.tab .num.ok { background: var(--ok-tint); color: var(--ok) }
.tab .num.plain { margin-left: 4px; background: var(--raise); color: var(--muted) }
@media (max-width: 620px) { #nav .tabs { overflow-x: auto; scrollbar-width: none } .tab { flex: none; padding: 0 12px } }

/* todo: one card per session, items in progress / pending, completed folded */
.todo-page .mdhead { padding-bottom: 12px }
.todo.closed { opacity: .6 }
.todo a.name:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px }
.todo .meta { margin-top: 6px }
.tlist { margin-top: 10px; display: grid; gap: 2px }
.ti summary, .ti .tsum { display: flex; align-items: baseline; gap: 10px; padding: 6px 8px; border-radius: 8px; list-style: none }
.ti summary { cursor: pointer }
.ti summary::-webkit-details-marker { display: none }
.ti summary:hover { background: var(--hover) }
.tmark { flex: none; width: 10px; height: 10px; border-radius: 99px; border: 1.5px solid var(--muted); transform: translateY(1px) }
.ti.in_progress .tmark { border-color: var(--ok); background: var(--ok) }
.ti.completed .tmark { border-color: var(--line2); background: var(--line2) }
.tsub { flex: 1; min-width: 0; font-size: 14px; overflow-wrap: anywhere }
.ti.completed .tsub { color: var(--muted) }
.tact { display: block; margin-top: 2px; font-size: 13px; color: var(--ok) }
.tid { flex: none; font-size: 12px; color: var(--faint) }
.tnote { padding: 0 8px 8px 28px; font-size: 13px; color: var(--muted) }
.tnote .dtext { margin: 0 0 4px }
.tnote b { font-weight: 600; color: var(--text) }
.tfold { justify-self: start; margin: 6px 0 0 8px }

/* decisions */
.dec .r1 { align-items: flex-start }
.dec .ttl { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere }
.dec .meta { margin-top: 6px; align-items: center }
.dec .src { display: inline-flex; align-items: center; gap: 6px }
.dec details { margin-top: 8px }
.dec summary { width: max-content; font-size: 12.5px; color: var(--muted); cursor: pointer }
.dec summary:hover { color: var(--text) }
.dtext { margin-top: 4px; font-size: 13.5px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere }
.opts { margin: 8px 0 0; padding-left: 20px; font-size: 13.5px }
.opts li + li { margin-top: 2px }
.decision { margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: var(--raise); font-size: 13.5px; overflow-wrap: anywhere }
.decision b { font-weight: 600; color: var(--muted); margin-right: 6px }
.refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px }
.ref { max-width: 100%; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); font: 11.5px/1.6 var(--mono); color: var(--muted); text-align: left; overflow-wrap: anywhere }
.ref:hover { border-color: var(--line2); color: var(--text) }
.ref .ic { margin-left: 6px; color: var(--faint); font-family: var(--sans) }
.golink { color: var(--clay-ink); font-weight: 500 }
.golink:hover { text-decoration: underline; text-underline-offset: 3px }

/* status.md */
.mdhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 16px 0 0; font-size: 12px; color: var(--faint) }
.mdhead b { font-weight: 500; color: var(--muted) }
.mdhead .devwhy { flex-basis: 100%; opacity: .85 }
.md { font-size: 14px; overflow-wrap: break-word }
.md h1, .md h2, .md h3, .md h4 { margin: 24px 0 8px; line-height: 1.35; letter-spacing: -.01em }
.md h1 { font-size: 20px; font-weight: 650 } .md h2 { font-size: 17px; font-weight: 650 } .md h3 { font-size: 15px; font-weight: 600 } .md h4 { font-size: 14px; font-weight: 600 }
.md p { margin: 8px 0 }
.md ul, .md ol { margin: 8px 0; padding-left: 20px }
.md li + li { margin-top: 2px }
.md li > ul, .md li > ol { margin: 2px 0 }
.md code { padding: 1px 4px; border-radius: 4px; background: var(--raise); font: 12px/1.5 var(--mono) }
.md pre { margin: 8px 0; padding: 8px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); overflow-x: auto }
.md pre code { padding: 0; background: none }
.md blockquote { margin: 8px 0; padding: 4px 12px; border-left: 2px solid var(--line2); color: var(--muted) }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0 }
.md a { color: var(--clay-ink); text-decoration: underline; text-underline-offset: 3px }
/* wide tables size to their content (cells wrap past 24em) and scroll inside their box, never the page */
.tablewrap { margin: 8px 0; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px }
.md table { border-collapse: collapse; font-size: 13px; width: max-content; min-width: 100% }
.md th, .md td { min-width: 4em; max-width: 24em; padding: 6px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line) }
.md th { font-weight: 600; color: var(--muted); background: var(--panel); white-space: nowrap }
.md tr:last-child td { border-bottom: 0 }

/* flow: who messaged whom (radial graph) and the message timeline */
.fhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 16px 0 0 }
.seg.flat { position: static; margin: 0; box-shadow: none }
.fhead .hint { font-size: 13px }
.graph { margin-top: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); overflow: hidden }
.graph svg { display: block; width: 100%; height: auto; user-select: none }
.fedge { fill: none; stroke: var(--line2) }
.farrow { fill: var(--line2) }
.fe { cursor: pointer }
.fhit { fill: none; stroke: transparent; stroke-width: 14 }
.fe:hover .fedge { stroke: var(--muted) } .fe:hover .farrow { fill: var(--muted) }
.fe.on .fedge { stroke: var(--text) } .fe.on .farrow { fill: var(--text) }
.fnode { cursor: pointer }
.fnode circle { fill: var(--raise); stroke: var(--muted); stroke-width: 1.5 }
.fnode.busy circle { fill: var(--ok-tint); stroke: var(--ok); stroke-width: 2 }
.fnode.blocked circle { fill: var(--clay-tint); stroke: var(--clay); stroke-width: 2 }
.fnode.done circle, .fnode.closed circle { fill: var(--bg); stroke: var(--line2) }
.fnode.g-task circle { stroke-dasharray: 3 2 }
.fnode.hub circle { stroke-width: 2.5 }
.fnode text { fill: var(--text); font: 600 12.5px var(--sans); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round }
.fnode.done text, .fnode.closed text { fill: var(--muted); font-weight: 500 }
.fnode.on circle { stroke: var(--text); stroke-width: 2.5 }
.fnode text.hover { display: none }
.fnode:hover text.hover, .fnode:focus text.hover { display: inline }
.gnote { padding: 0 14px 10px; font-size: 12.5px; color: var(--faint) }
.graph .dim { opacity: .2 }
.fsel { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 8px 8px 14px; border-radius: 10px; background: var(--raise); font-size: 13.5px }
.fsel b { font-weight: 700 }
.fsel button { margin-left: auto; height: 28px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line2); font-size: 12.5px; color: var(--muted) }
.fsel button:hover { color: var(--text); background: var(--hover) }
.fmsg { padding: 12px 16px 12px 18px; margin-bottom: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel) }
.fmsg .r1 { gap: 8px; font-size: 13.5px; color: var(--muted) }
.fmsg .r1 b { font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.fmsg .r1 time { margin-left: auto; flex: none; font-size: 12.5px; color: var(--faint) }
.fmsg .arrow { flex: none; color: var(--faint) }
.fsum { margin-top: 6px; font-size: 14.5px; overflow-wrap: anywhere }
.fmsg .txt { margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: var(--raise); font-size: 13.5px }
.fmsg .more { margin-top: 6px }
/* tokens: 처리 토큰 bars by size, colored by engine */
.toks { display: grid; gap: 6px }
.tok { display: grid; grid-template-columns: minmax(0, 11em) 1fr auto; align-items: center; gap: 10px; font-size: 13.5px }
.tok .tn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600 }
.tok .tn small { margin-left: 6px; font: 400 11.5px var(--mono); color: var(--faint) }
.tok .tb { height: 10px; border-radius: 99px; background: var(--raise); overflow: hidden }
.tok .tb i { display: block; height: 100%; min-width: 3px; border-radius: 99px; background: var(--clay) }
.tok.codex .tb i, .tleg .codex::before { background: var(--muted) }
.tok b { font-weight: 700; text-align: right }
.tleg { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 10px; font-size: 12.5px; color: var(--faint) }
.tleg span::before { content: ''; display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 3px; background: var(--clay); vertical-align: -1px }
.tleg .def { flex-basis: 100% }
.tleg .def::before { display: none }
.toks + .more { margin-top: 8px }
.kb { flex: none; display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: var(--raise); color: var(--text) }
.kb.report { background: var(--ok-tint); color: var(--ok) }
.kb.notice { background: var(--clay-tint); color: var(--clay-ink) }
.kb.other { background: none; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line2); font-weight: 600 }
</style>
</head>
<body>
<header id="top"></header>
<div id="usage" aria-label="남은 사용량"></div>
<div id="dev" aria-label="dev 점유" hidden></div>
<nav id="nav"></nav>
<main id="view"></main>
<script src="/vendor/xterm.js"></script>
<script>
'use strict'
const topBar = document.getElementById('top'), nav = document.getElementById('nav'), view = document.getElementById('view')

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue
    if (k === 'class') el.className = v
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else el.setAttribute(k, v === true ? '' : v)
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c)
  return el
}
const put = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter(c => c != null && c !== false))
const NS = 'http://www.w3.org/2000/svg'   // sv(): h() for SVG elements
function sv(tag, attrs, ...kids) {
  const el = document.createElementNS(NS, tag)
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else el.setAttribute(k, v)
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c)
  return el
}

const span = ms => {
  const m = Math.max(0, Math.floor((Date.now() - ms) / 60000))
  if (m < 1) return '방금'
  if (m < 60) return m + '분'
  const hr = Math.floor(m / 60)
  return hr < 24 ? `${hr}시간 ${m % 60}분` : `${Math.floor(hr / 24)}일 ${hr % 24}시간`
}
const ago = ms => ms ? (span(ms) === '방금' ? '방금' : span(ms) + ' 전') : '기록 없음'
const hm = ms => ms ? ' ' + new Date(ms).toTimeString().slice(0, 5) : ''
const home = p => (p || '').replace(/^\/home\/[^/]+/, '~')
const clock = iso => {
  if (!iso) return ''
  const d = new Date(iso), p = n => String(n).padStart(2, '0')
  const t = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`
  return d.toDateString() === new Date().toDateString() ? t : `${d.getMonth() + 1}월 ${d.getDate()}일 ${t}`
}

function status(a) {
  if (a.state === 'working' || a.status === 'busy') return { key: 'busy', label: '작업 중' }
  if (a.state === 'blocked') return { key: 'blocked', label: '입력 필요' }
  if (a.state === 'done') return { key: 'done', label: '끝남' }
  return { key: 'idle', label: a.kind === 'interactive' || a.engine === 'codex' ? '지시 대기' : '대기' }
}
const stateEl = s => h('span', { class: 'chip ' + s.key }, h('span', { class: 'dot', 'aria-hidden': 'true' }), s.label)
const kindLabel = a => a.engine === 'codex' ? 'codex ' + (a.source || '') : a.kind === 'background' ? '백그라운드' : '대화형'
// resident sessions carry their lane, one-off task sessions their job id; sessions not in agents.json get neither
const badge = a => a.engine === 'codex' ? h('span', { class: 'badge codex', title: 'Codex 세션' }, 'codex')
  : a.group === 'resident' ? h('span', { class: 'badge lane', title: '상시 세션 레인' }, a.lane || '상시')
  : a.group === 'task' ? h('span', { class: 'badge task', title: '일회성 작업' + (a.lane ? ', ' + a.lane : '') }, a.task || '일회성')
  : null
const SECTIONS = [['busy', '진행 중'], ['wait', '입력 대기'], ['done', '종료']]
let doneOpen = false
try { doneOpen = localStorage.getItem('doneOpen') === '1' } catch (e) {}

let agents = [], error = '', cur = null, page = 'agents'

async function getJSON(url) {
  const r = await fetch(url)
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status)
  return r.json()
}

/* ---------- header ---------- */
function renderTop() {
  const n = k => agents.filter(a => status(a).key === k).length
  const blocked = n('blocked')
  const themeBtn = h('button', {
    class: 'theme', title: '밝은 화면과 어두운 화면 바꾸기', 'aria-label': '테마 바꾸기',
    onclick() {
      const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'
      document.documentElement.dataset.theme = t
      try { localStorage.setItem('theme', t) } catch (e) {}
    }
  }, h('span', { 'aria-hidden': 'true' }, '◐'))
  put(topBar, 
    cur ? h('a', { class: 'back', href: '#/' }, '‹ 목록') : h('h1', {}, '에이전트 대시보드'),
    h('div', { class: 'counts' },
      blocked ? h('span', { class: 'count blocked' }, '입력 필요 ', h('b', { class: 'num' }, blocked)) : null,
      h('span', { class: 'count' + (n('busy') ? ' ok' : '') }, '작업 중 ', h('b', { class: 'num' }, n('busy'))),
      subRun() ? h('span', { class: 'count ok', title: '지금 도는 서브에이전트' }, '서브에이전트 ', h('b', { class: 'num' }, subRun())) : null,
      h('span', { class: 'count' }, '전체 ', h('b', { class: 'num' }, agents.length))),
    notifyBtn(), themeBtn)
  renderTitle()
  nav.hidden = !!cur
  const nNow = dec?.now?.length || 0, tc = todo?.counts || {}
  put(nav, h('div', { class: 'tabs', role: 'tablist' }, PAGES.map(([key, label, href]) =>
    h('button', { class: 'tab', role: 'tab', 'aria-selected': String(page === key), onclick: () => { location.hash = href } },
      label, key === 'decisions' && nNow ? h('span', { class: 'num', title: '지금 결정 필요' }, nNow) : null,
      key === 'todo' ? [tc.in_progress ? h('span', { class: 'num ok', title: '진행 중인 할 일' }, tc.in_progress) : null,
        tc.pending ? h('span', { class: 'num plain', title: '대기 중인 할 일' }, tc.pending) : null] : null))))
}
const subRun = () => agents.reduce((n, a) => n + (a.subagents || []).filter(s => s.state === 'busy').length, 0)
const PAGES = [['agents', '에이전트', '#/'], ['decisions', '결정', '#/decisions'], ['status', '현황', '#/status'], ['flow', '흐름', '#/flow'], ['todo', '할 일', '#/todo']]

/* ---------- alerts: tab title count and browser notifications ---------- */
// reports to the hub newer than reportMark are new; unread ones count in the title until the page is seen
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v) } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} }
}
let reportMark = store.get('reportMark', null), notifyOn = store.get('notify', false)
const unread = new Set()
const canNotify = () => 'Notification' in window && Notification.permission === 'granted' && notifyOn
function renderTitle() {
  const n = agents.filter(a => status(a).key === 'blocked').length + unread.size
  document.title = (n ? `(${n}) ` : '') + '에이전트 대시보드'
}
function seen() {
  if (document.visibilityState === 'visible' && unread.size) { unread.clear(); renderTitle() }
}
// remembered across reloads and tabs, so one event is announced once
function firstTime(key) {
  const done = store.get('notified', [])
  if (done.includes(key)) return false
  store.set('notified', [...done, key].slice(-300))
  return true
}
function forget(keys) {
  const done = store.get('notified', [])
  if (done.some(k => keys.includes(k))) store.set('notified', done.filter(k => !keys.includes(k)))
}
function notify(title, body, tag, hash) {
  try {
    const n = new Notification(title, { body: (body || '').slice(0, 300), tag })
    n.onclick = () => { window.focus(); location.hash = hash; n.close() }
  } catch (e) {}
}
// a session that turns blocked is announced once; once it moves on, the next block is new again
function checkBlocked() {
  const blocked = agents.filter(a => status(a).key === 'blocked')
  const keys = blocked.map(a => 'b:' + a.sessionId)
  forget(store.get('notified', []).filter(k => k.startsWith('b:') && !keys.includes(k)))
  if (!canNotify()) return
  for (const a of blocked) if (firstTime('b:' + a.sessionId)) notify(`${a.name || a.sessionId.slice(0, 8)} 입력 필요`, a.needs || a.detail, 'b:' + a.sessionId, '#/s/' + a.sessionId)
}
function checkReports(d) {
  const reports = (d.messages || []).filter(m => m.kind === 'report' && m.to === d.hub && m.t)
  const top = Math.max(0, ...reports.map(m => m.t))
  if (reportMark == null) { reportMark = top || Date.now(); store.set('reportMark', reportMark); return }   // history is not news
  const fresh = reports.filter(m => m.t > reportMark).reverse()
  if (!fresh.length) return
  fresh.forEach(m => unread.add(m.id))
  reportMark = top; store.set('reportMark', reportMark)
  const news = canNotify() ? fresh.filter(m => firstTime('r:' + m.id)) : []
  if (news.length > 3) notify(`${d.hub} 에게 보고 ${news.length}건`, news.map(m => `${m.from}: ${m.sum}`).join('\n'), 'reports', '#/flow')
  else news.forEach(m => notify(`${m.from} 보고`, m.sum, 'r:' + m.id, '#/flow'))
  renderTitle(); seen()
}
// the label hides below 620 px and the bell stays (title and aria-label carry the words)
const bell = () => sv('svg', { width: 15, height: 15, viewBox: '0 0 16 16', 'aria-hidden': 'true', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-linejoin': 'round' },
  sv('path', { d: 'M4 11.5V7a4 4 0 0 1 8 0v4.5l1.2 1.3H2.8z' }), sv('path', { d: 'M6.5 14.2a1.6 1.6 0 0 0 3 0' }))
function notifyBtn() {
  const btn = (attrs, label) => h('button', Object.assign({ class: 'notif', 'aria-label': label }, attrs), bell(), h('span', { class: 'lbl' }, label))
  if (!('Notification' in window)) return btn({ disabled: true, title: '이 브라우저는 알림을 지원하지 않습니다' }, '알림 없음')
  if (Notification.permission === 'denied') return btn({ disabled: true, title: '브라우저 설정에서 이 주소의 알림을 허용해야 켤 수 있습니다' }, '알림 막힘')
  const on = canNotify()
  return btn({
    'aria-pressed': String(on),
    title: on ? '켜져 있음: 세션이 입력 필요가 되거나 허브에게 보고가 오면 알립니다. 누르면 끕니다.'
      : '세션이 입력 필요가 되거나 허브에게 보고가 오면 브라우저 알림으로 알립니다',
    async onclick() {
      if (on) notifyOn = false
      else {
        if (Notification.permission === 'default') await Notification.requestPermission()
        notifyOn = Notification.permission === 'granted'
        // what is blocked right now is the starting point; only changes from here are announced
        if (notifyOn) agents.filter(a => status(a).key === 'blocked').forEach(a => firstTime('b:' + a.sessionId))
      }
      store.set('notify', notifyOn); renderTop()
    }
  }, on ? '알림 켬' : '알림 켜기')
}

/* ---------- tokens ---------- */
// 792000 -> 79.2만, 115753467 -> 1.2억 (one decimal below 100 of the unit)
const tok = n => {
  if (n >= 1e8) return +(n / 1e8).toFixed(n < 1e10 ? 1 : 0) + '억'
  if (n >= 1e4) return +(n / 1e4).toFixed(n < 1e6 ? 1 : 0) + '만'
  return n.toLocaleString()
}
// 처리 토큰 = input (cache writes in, cache reads out) + output; cache reads only show in the tooltip
const ENGINE = { claude: 'Claude', codex: 'codex' }
const TOK_DEF = '처리 토큰 = 입력(캐시 쓰기 포함, 캐시 읽기 제외) + 출력'
function tokTip(t) {
  const n = x => (x || 0).toLocaleString()
  const read = `. 합에 넣지 않은 캐시 읽기 ${n(t.cacheRead)}`
  if (t.engine === 'codex') return `처리 토큰 ${n(t.total)}: 입력 ${n(t.input)}(캐시 제외), 출력 ${n(t.output)}(그중 추론 ${n(t.reasoning)})` + read
  return `처리 토큰 ${n(t.total)}: 입력 ${n(t.input)}, 캐시 쓰기 ${n(t.cacheWrite)}, 출력 ${n(t.output)}` + read
    + (t.subagents ? `. 서브에이전트 기록 ${t.subagents}개 포함` : '')
}
const withTokens = () => agents.filter(a => a.tokens).sort((a, b) => b.tokens.total - a.tokens.total)

/* ---------- list ---------- */
const SUB_STATE = { busy: '작업 중', done: '끝남', idle: '응답 없음' }
const openSubs = new Set()
try { JSON.parse(localStorage.getItem('openSubs') || '[]').forEach(x => openSubs.add(x)) } catch (e) {}
const saveSubs = () => { try { localStorage.setItem('openSubs', JSON.stringify([...openSubs])) } catch (e) {} }

function subItem(s) {
  return h('li', { class: 'sub ' + s.state },
    h('span', { class: 'dot', 'aria-hidden': 'true' }),
    h('div', { class: 'sd' }, h('span', { class: 'st' }, s.type || '서브에이전트'), s.desc || '설명 없음'),
    h('time', {}, ago(s.at)),
    h('div', { class: 'sl' }, SUB_STATE[s.state] || s.state))
}
function subList(a) {
  return h('ul', { class: 'sublist' }, (a.subagents || []).map(subItem))
}
function subFold(a) {
  const subs = a.subagents || []
  if (!subs.length) return null
  const run = subs.filter(s => s.state === 'busy').length, open = openSubs.has(a.sessionId)
  return h('div', { class: 'subs' },
    h('button', {
      class: 'subs-t', 'aria-expanded': String(open),
      onclick() { open ? openSubs.delete(a.sessionId) : openSubs.add(a.sessionId); saveSubs(); renderList() }
    }, '서브에이전트 ', h('b', {}, subs.length + '개'), run ? h('span', { class: 'run' }, `${run}개 작업 중`) : null,
      h('span', { class: 'chev', 'aria-hidden': 'true' }, open ? '접기' : '펼치기')),
    open ? subList(a) : null)
}

function agentCard(a) {
  const s = status(a)
  return h('article', { class: `agent ${s.key} g-${a.group || 'other'}` },
    h('a', { class: 'amain', href: '#/s/' + a.sessionId },
      h('div', { class: 'r1' }, h('span', { class: 'name' }, a.name || a.sessionId.slice(0, 8)), badge(a), stateEl(s)),
      a.detail ? h('div', { class: 'why' }, a.detail) : null,
      s.key === 'blocked' && a.needs ? h('div', { class: 'needs' }, a.needs) : null,
      h('div', { class: 'meta' },
        h('span', {}, '활동 ', h('b', {}, ago(a.lastActivity)), hm(a.lastActivity)),
        h('span', {}, '시작 ', h('b', {}, ago(a.startedAt))),
        h('span', {}, kindLabel(a)),
        h('span', { class: 'mono', title: home(a.cwd) }, home(a.cwd).split('/').pop()),
        a.tokens ? h('span', { title: tokTip(a.tokens) }, '토큰 ', h('b', {}, tok(a.tokens.total))) : null)),
    subFold(a))
}

// the server already sorts: section, then task / resident / other, then latest activity
function renderList() {
  const scroll = view.querySelector('.scroll.list') || h('div', { class: 'scroll list' })
  put(scroll, 
    error ? h('div', { class: 'banner' }, `서버에 연결하지 못했습니다(${error}). 폴더에서 ./run.sh 로 다시 띄우세요.`) : null,

let stat = null, statShown = null

// tiny Markdown subset: headings, lists (nested by indent), tables, fenced code, quotes, rules, paragraphs;
// inline code, **bold**, [text](url). Builds DOM nodes only, never HTML strings.
function inline(s) {
  const out = [], re = /`([^`]+)`|\*\*(.+?)\*\*|\[([^\]]+)\]\(([^)\s]+)\)/g
  let last = 0, m
  while ((m = re.exec(s))) {
    out.push(s.slice(last, m.index)); last = re.lastIndex
    if (m[1] != null) out.push(h('code', {}, m[1]))
    else if (m[2] != null) out.push(h('strong', {}, inline(m[2])))
    else out.push(/^https?:\/\//.test(m[4]) ? h('a', { href: m[4], target: '_blank', rel: 'noopener noreferrer' }, m[3]) : h('span', { title: m[4] }, m[3]))
  }
  out.push(s.slice(last))
  return out
}
function cells(line) {   // split a table row on |, but not inside `code` or after a backslash
  const out = []; let cell = '', code = false
  line = line.trim().replace(/^\|/, '').replace(/\|$/, '')
  for (let i = 0; i < line.length; i++) {
    const c = line[i]
    if (c === '\\' && line[i + 1] === '|') { cell += '|'; i++ }
    else if (c === '`') { code = !code; cell += c }
    else if (c === '|' && !code) { out.push(cell.trim()); cell = '' }
    else cell += c
  }
  return [...out, cell.trim()]
}
function md(src) {
  const lines = src.replace(/\r/g, '').split('\n'), out = []
  const LI = /^(\s*)([-*+]|\d+\.)\s+(.*)/
  let i = 0
  while (i < lines.length) {
    const l = lines[i]; let m
    if (!l.trim()) { i++; continue }
    if (/^\s*```/.test(l)) {
      const buf = []
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) buf.push(lines[i])
      i++; out.push(h('pre', {}, h('code', {}, buf.join('\n')))); continue
    }
    if ((m = l.match(/^(#{1,6})\s+(.*)/))) { out.push(h('h' + m[1].length, {}, inline(m[2]))); i++; continue }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push(h('hr')); i++; continue }
    if (l.trim().startsWith('|') && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || '')) {
      const head = cells(l), rows = []
      for (i += 2; i < lines.length && lines[i].trim().startsWith('|'); i++) rows.push(cells(lines[i]))
      out.push(h('div', { class: 'tablewrap' }, h('table', {},
        h('thead', {}, h('tr', {}, head.map(c => h('th', {}, inline(c))))),
        h('tbody', {}, rows.map(r => h('tr', {}, head.map((_, k) => h('td', {}, inline(r[k] || '')))))))))
      continue
    }
    if (LI.test(l)) {
      const stack = []   // [{indent, list, li}]
      for (; i < lines.length && lines[i].trim(); i++) {
        const it = lines[i].match(LI)
        if (!it) { if (stack.length) stack.at(-1).li.append(' ', ...inline(lines[i].trim())); continue }
        const ind = it[1].replace(/\t/g, '    ').length
        while (stack.length > 1 && ind < stack.at(-1).indent) stack.pop()
        if (!stack.length || ind > stack.at(-1).indent) {
          const list = h(/\d/.test(it[2]) ? 'ol' : 'ul')
          if (stack.length) stack.at(-1).li.append(list); else out.push(list)
          stack.push({ indent: ind, list })
        }
        const li = h('li', {}, inline(it[3]))
        stack.at(-1).list.append(li); stack.at(-1).li = li
      }
      continue
    }
    if (l.startsWith('>')) {
      const buf = []
      for (; i < lines.length && lines[i].startsWith('>'); i++) buf.push(lines[i].replace(/^>\s?/, ''))
      out.push(h('blockquote', {}, inline(buf.join(' ')))); continue
    }
    const buf = [l.trim()]   // always take the first line, so an odd line like a lone '|x' cannot stall the loop
    for (i++; i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*```|\s*\|)/.test(lines[i]) && !LI.test(lines[i]); i++) buf.push(lines[i].trim())
    out.push(h('p', {}, inline(buf.join(' '))))
  }
  return out
}

/* ---------- flow: messages between sessions ---------- */
const WINDOWS = [[1, '1시간'], [6, '6시간'], [24, '24시간'], [0, '전체']]
const KIND_LABEL = { assign: '배정', report: '보고', notice: '알림', other: '기타' }
const GROUP_RANK = { resident: 0, task: 1, codex: 2, other: 3 }
let flowHours = 24, flow = null, flowKey = '', flowSel = null
try { const v = localStorage.getItem('flowHours'); if (WINDOWS.some(([x]) => String(x) === v)) flowHours = +v } catch (e) {}
const openMsgs = new Set()
const short = ms => clock(ms).replace(/:\d\d$/, '')
const nodeKey = n => n.listed ? status(n).key : 'closed'
const nodeTip = n => [n.name,
  n.group === 'resident' ? '상시 ' + (n.lane || '') : n.group === 'task' ? '일회성 ' + (n.task || '') : n.group === 'codex' ? 'codex' : '',
  n.listed ? status(n).label : '목록에 없음(닫힘)', `보냄 ${n.sent}, 받음 ${n.got}`].filter(x => x && x.trim()).join(', ')
const related = (m, sel) => !sel || (sel.node ? m.from === sel.node || m.to === sel.node : m.from === sel.edge[0] && m.to === sel.edge[1])
function select(sel) {
  const same = sel && flowSel && JSON.stringify(sel) === JSON.stringify(flowSel)
  flowSel = same ? null : sel
  renderFlowTab()
}

// hub in the middle, the busiest RING sessions named on an ellipse around it, any others as small unnamed dots
// on an inner ellipse (name on hover or when picked); edges bend left of travel so A→B and B→A part
const RING = 16
function graphEl(f, W) {
  const H = Math.round(Math.min(480, Math.max(340, W * 0.68))), cx = W / 2, cy = H / 2
  const load = n => n.sent + n.got
  const hub = f.nodes.find(n => n.name === f.hub) || [...f.nodes].sort((a, b) => load(b) - load(a))[0]
  const rest = f.nodes.filter(n => n !== hub)
    .sort((a, b) => (GROUP_RANK[a.group] ?? 9) - (GROUP_RANK[b.group] ?? 9) || load(b) - load(a) || a.name.localeCompare(b.name))
  const named = new Set([...rest].sort((a, b) => load(b) - load(a)).slice(0, RING).map(n => n.name))
  const outer = rest.filter(n => named.has(n.name)), inner = rest.filter(n => !named.has(n.name))
  const rx = W / 2 - 80, ry = H / 2 - 52, pos = new Map([[hub.name, { x: cx, y: cy, r: 18 }]])
  outer.forEach((n, i) => {
    const a = -Math.PI / 2 + 2 * Math.PI * i / outer.length
    pos.set(n.name, { x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a), r: 7 + Math.min(9, Math.sqrt(load(n)) * 1.3) })
  })
  inner.forEach((n, i) => {
    const a = -Math.PI / 2 + 2 * Math.PI * (i + 0.5) / inner.length
    pos.set(n.name, { x: cx + rx * 0.58 * Math.cos(a), y: cy + ry * 0.58 * Math.sin(a), r: 4.5, dot: true })
  })
  const unit = (p, q) => { const l = Math.hypot(q.x - p.x, q.y - p.y) || 1; return { x: (q.x - p.x) / l, y: (q.y - p.y) / l } }
  const sel = flowSel
  const edges = f.edges.map(e => {
    const a = pos.get(e.from), b = pos.get(e.to)
    if (!a || !b || a === b) return null
    const len = Math.hypot(b.x - a.x, b.y - a.y) || 1, k = Math.min(36, len * 0.14)
    const c = { x: (a.x + b.x) / 2 + (b.y - a.y) / len * k, y: (a.y + b.y) / 2 - (b.x - a.x) / len * k }
    const w = Math.min(7, 1.2 + 1.6 * Math.log2(e.count)), L = 6 + w, hw = 3.5 + w / 2
    const u1 = unit(a, c), u2 = unit(b, c)
    const tip = { x: b.x + u2.x * (b.r + 2), y: b.y + u2.y * (b.r + 2) }, base = { x: tip.x + u2.x * L, y: tip.y + u2.y * L }
    const s = { x: a.x + u1.x * (a.r + 2), y: a.y + u1.y * (a.r + 2) }
    const d = `M${s.x.toFixed(1)},${s.y.toFixed(1)} Q${c.x.toFixed(1)},${c.y.toFixed(1)} ${base.x.toFixed(1)},${base.y.toFixed(1)}`
    const pts = [tip, { x: base.x - u2.y * hw, y: base.y + u2.x * hw }, { x: base.x + u2.y * hw, y: base.y - u2.x * hw }]
    const on = sel && (sel.edge ? sel.edge[0] === e.from && sel.edge[1] === e.to : e.from === sel.node || e.to === sel.node)
    return sv('g', {
      class: 'fe' + (on ? ' on' : sel ? ' dim' : ''),
      onclick(ev) { ev.stopPropagation(); select({ edge: [e.from, e.to] }) }
    }, sv('title', {}, `${e.from} → ${e.to} ${e.count}건, 마지막 ${short(e.last)}`),
      sv('path', { class: 'fhit', d }), sv('path', { class: 'fedge', d, 'stroke-width': w.toFixed(1) }),
      sv('polygon', { class: 'farrow', points: pts.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ') }))
  })
  const nodes = [hub, ...inner, ...outer].map(n => {
    const p = pos.get(n.name), fit = Math.max(6, Math.floor(2 * Math.min(p.x, W - p.x) / 7.4))   // ~7.4 px per character
    const on = sel && (sel.node ? sel.node === n.name : sel.edge.includes(n.name))
    const pick = () => select({ node: n.name })
    return sv('g', {
      class: `fnode ${nodeKey(n)} g-${n.group}${n === hub ? ' hub' : ''}${on ? ' on' : sel && !on ? ' dim' : ''}`,
      transform: `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`, tabindex: 0, role: 'button', 'aria-label': nodeTip(n),
      onclick(ev) { ev.stopPropagation(); pick() },
      onkeydown(ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick() } }
    }, sv('title', {}, nodeTip(n)), sv('circle', { r: p.r.toFixed(1) }),
      sv('text', { y: (p.r + 15).toFixed(1), 'text-anchor': 'middle', class: p.dot && !on ? 'hover' : null }, n.name.length > fit ? n.name.slice(0, fit - 1) + '…' : n.name))
  })
  return [sv('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'group', 'aria-label': '세션 사이 메시지 그래프', onclick: () => flowSel && select(null) },
    edges, nodes),
    inner.length ? h('div', { class: 'gnote' }, `건수가 많은 ${RING}개만 이름을 붙였습니다. 안쪽 점 ${inner.length}개는 올리거나 누르면 이름이 보입니다.`) : null]
}

let tokAll = false
const TOK_TOP = 5   // bars shown before 더 보기, so the message list stays near the graph
const tokBox = h('div')   // redrawn on its own when the agent list refreshes
function tokenBars() {
  const rows = withTokens()
  if (!rows.length) return null
  const max = rows[0].tokens.total || 1, dup = n => rows.filter(a => a.name === n).length > 1
  const shown = tokAll ? rows : rows.slice(0, TOK_TOP)
  return h('section', { class: 'sec' },
    h('div', { class: 'sec-h' }, h('h2', {}, '세션별 처리 토큰'), h('span', { class: 'num' }, rows.length)),
    h('div', { class: 'tleg' }, h('span', { class: 'def' }, TOK_DEF + '. Claude 는 서브에이전트 기록까지 더합니다.'),
      h('span', { class: 'claude' }, 'Claude'), h('span', { class: 'codex' }, 'codex')),
    h('div', { class: 'toks' }, shown.map(a => h('div', { class: 'tok ' + a.tokens.engine, title: tokTip(a.tokens) },
      h('span', { class: 'tn' }, a.name || a.sessionId.slice(0, 8), dup(a.name) ? h('small', {}, a.sessionId.slice(0, 8)) : null),
      h('span', { class: 'tb', 'aria-hidden': 'true' }, h('i', { style: `width:${(100 * a.tokens.total / max).toFixed(2)}%` })),
      h('b', { class: 'num' }, tok(a.tokens.total))))),
    rows.length > TOK_TOP ? h('button', { class: 'more', onclick() { tokAll = !tokAll; put(tokBox, tokenBars()) } }, tokAll ? '접기' : `${rows.length - TOK_TOP}개 더 보기`) : null)
}

// every 5 s on the flow tab; elsewhere every 15 s, only for the report count and alerts
let msgAt = 0
async function pollMessages() {
  const onFlow = !cur && page === 'flow' && !document.hidden
  if (!onFlow && Date.now() - msgAt < 15000) return
  const hours = onFlow ? flowHours : 24
  msgAt = Date.now()
  try {
    const r = await fetch('/api/messages?hours=' + hours)
    const text = await r.text()
    if (!r.ok) throw new Error(r.status)
    if (text === flowKey) return   // nothing new
    const d = JSON.parse(text)
    checkReports(d)
    if (hours !== flowHours) return   // a background read, or the window changed meanwhile
    flowKey = text; flow = d
  } catch (err) { if (!flow && onFlow) flow = { error: err.message } }
  if (!cur && page === 'flow') renderFlowTab()
}

function addResult(e) {
  const t = cur.tools.get(e.id)
  if (!t) return
  t.mark.textContent = e.err ? '✕' : '✓'
  t.mark.className = 'mark ' + (e.err ? 'err' : 'ok')

  t.body.append(h('pre', { class: e.err ? 'err' : '' }, e.text || '(출력 없음)'))

async function pollTranscript() {
  const c = cur
  if (!c || c.tab !== 'chat' || c.loading) return
  c.loading = true
  try {
    const r = await getJSON(`/api/transcript?sid=${encodeURIComponent(c.sid)}&from=${c.offset}`)
    if (cur !== c) return
    const feed = c.feed
    const follow = c.offset < 0 || feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120
    if (r.reset) {
      c.tools.clear()
      put(feed, r.missing ? h('div', { class: 'empty' }, '이 세션은 아직 기록 파일이 없습니다. 첫 대화가 오가면 여기에 나옵니다.') : null,
        r.truncated ? h('div', { class: 'note-top' }, `최근 ${r.events.length}건만 보여 줍니다.`) : null)
    }
    for (const e of r.events) e.k === 'result' ? addResult(e) : feed.append(eventEl(e))
    c.offset = r.offset
    if (follow && r.events.length) feed.scrollTop = feed.scrollHeight
  } catch (err) {
    if (c.offset < 0) put(c.feed, h('div', { class: 'banner' }, '기록을 읽지 못했습니다: ' + err.message))
  } finally { c.loading = false }
}

/* ---------- session window (claude logs) ---------- */
const COLS = 300   // wider than any daemon pty seen (~200), so nothing wraps; fitTerm crops to used width
function fitTerm(c) {
  const term = c.term, buf = term.buffer.active
  let used = 20
  for (let y = 0; y < buf.length; y++) {
    const line = buf.getLine(y)
    for (let x = term.cols - 1; x >= used; x--) if (line.getCell(x)?.getChars().trim()) { used = x + 1; break }
  }
  const screen = c.box.querySelector('.xterm-screen')
  const cellW = screen.offsetWidth / term.cols
  if (!cellW) return
  const avail = c.box.parentElement.clientWidth - 20
  const fs = Math.max(7, Math.min(13, Math.floor(term.options.fontSize * avail / (used * cellW) * 2) / 2))
  if (fs !== term.options.fontSize) term.options.fontSize = fs
  requestAnimationFrame(() => { c.box.style.width = Math.ceil(used * screen.offsetWidth / term.cols) + 'px' })
}

// portrait friendly view: the terminal is parsed at full width, then its rows are re-flowed as wrapping text
let logMode = 'flow'
try { logMode = localStorage.getItem('logMode') === 'raw' ? 'raw' : 'flow' } catch (e) {}
const RULE = /^[\s\u2500-\u257f]+$/   // box drawing rows
function flowRows(term) {
  const buf = term.buffer.active, rows = []
  for (let y = 0; y < buf.length; y++) rows.push((buf.getLine(y)?.translateToString(true) || '').replace(/\s+$/, ''))
  while (rows.length && !rows.at(-1)) rows.pop()
  const out = []
  for (const l of rows) {
    if (!l) { if (out.length && out.at(-1) !== '') out.push(''); continue }
    out.push(l)
  }
  return out
}
function renderFlow(c) {
  const pane = c.pane, follow = !c.flowShown || pane.scrollHeight - pane.scrollTop - pane.clientHeight < 120
  put(c.flowEl, flowRows(c.term).map(l => {
    if (!l) return h('div', { class: 'll gap' })
    if (RULE.test(l)) return h('div', { class: 'll sep' })
    const k = l.trimStart()[0]
    return h('div', { class: 'll' + (k === '\u25cf' ? ' bul' : k === '\u23bf' ? ' res' : k === '\u276f' ? ' prm' : '') }, l)
  }))
  c.flowShown = true
  if (follow) pane.scrollTop = pane.scrollHeight
}
function applyLogMode(c) {
  const flow = logMode === 'flow'
  c.flowEl.hidden = !flow
  c.rawWrap.classList.toggle('off', flow)
  for (const [m, btn] of Object.entries(c.modeBtns)) btn.setAttribute('aria-pressed', String(m === logMode))
  c.note.textContent = flow
    ? 'claude logs 출력을 3초마다 다시 그립니다. 화면 폭에 맞춰 줄바꿈한 글만 보여 주며 색과 배치는 원본 화면에서 볼 수 있습니다.'
    : 'claude logs 출력을 3초마다 다시 그립니다. 출력이 화면 중간부터 남아 있으면 위쪽이 비어 보일 수 있습니다.'
  if (!flow) requestAnimationFrame(() => fitTerm(c))
}

async function pollLogs() {
  const c = cur
  if (!c || c.tab !== 'logs' || !c.agent?.id || c.loadingLogs || document.hidden) return
  c.loadingLogs = true
  try {
    const r = await fetch('/api/logs?id=' + encodeURIComponent(c.agent.id))
    const text = await r.text()
    if (cur !== c || text === c.logText) return
    c.logText = text
    // The TUI paints with absolute rows (CSI row;col H); the largest row is the screen height.
    let rows = 24
    for (const m of text.matchAll(/\x1b\[(\d+);\d+H/g)) rows = Math.max(rows, +m[1])
    if (!c.term) {
      c.box = h('div', { class: 'term' })
      c.rawWrap = h('div', { class: 'termwrap' }, c.box)
      c.flowEl = h('div', { class: 'logflow' })
      c.note = h('p', { class: 'tnote' })
      c.modeBtns = {}
      const mk = (m, label) => (c.modeBtns[m] = h('button', {
        class: 'segb', onclick() { logMode = m; try { localStorage.setItem('logMode', m) } catch (e) {} applyLogMode(c) }
      }, label))
      put(c.pane, h('div', { class: 'seg', role: 'group', 'aria-label': '세션 창 보기 방식' }, mk('flow', '세로 보기'), mk('raw', '원본 화면')),
        c.flowEl, c.rawWrap, c.note)
      c.term = new Terminal({
        cols: COLS, rows, fontSize: 10, scrollback: 0, disableStdin: true, cursorBlink: false,
        fontFamily: getComputedStyle(document.body).getPropertyValue('--mono'),
        theme: { background: '#141413', foreground: '#E8E6DC', cursor: '#141413', cursorAccent: '#141413' }
      })
      c.term.open(c.box)
      applyLogMode(c)
    } else if (c.term.rows !== rows) c.term.resize(COLS, rows)
    const first = !c.fitted
    c.term.reset()
    c.term.write(text + '\x1b[?25l', () => {
      fitTerm(c); c.fitted = true
      renderFlow(c)
      if (first) c.pane.scrollTop = c.pane.scrollHeight
    })
  } catch (err) {
    if (!c.term) put(c.pane, h('div', { class: 'banner' }, '세션 창을 읽지 못했습니다: ' + err.message))
  } finally { c.loadingLogs = false }
}

/* ---------- usage bar ---------- */
const usageBar = document.getElementById('usage')
const LOW = 20   // 남은 % 가 이보다 적으면 경고 색
const winName = w => ({ 300: '5시간', 10080: '주간' })[w.minutes] || (w.minutes ? (w.minutes % 60 ? w.minutes + '분' : w.minutes / 60 + '시간') : w.key)
const until = ms => { const t = span(2 * Date.now() - ms); return t === '방금' ? '곧' : t + ' 뒤' }   // span() counts back; mirror it
let usage = null

function renderUsage() {
  put(usageBar, [['claude', 'Claude'], ['codex', 'Codex']].map(([k, label]) => {
    const e = usage?.[k]
    if (!e) return null
    if (e.state === 'missing') return h('span', { class: 'use missing' }, h('b', {}, label), '기록 없음')
    if (e.state === 'broken') return h('span', { class: 'use broken', title: e.error }, h('b', {}, label), '읽지 못함')
    return h('span', { class: 'use ' + e.state, title: `기록 ${clock(e.at)}` + (e.plan ? `, ${e.plan}` : '') },
      h('b', {}, label),
      e.windows.map(w => {
        const left = Math.max(0, Math.round(100 - w.used))
        if (w.reset) return h('span', { class: 'win', title: '리셋 시각이 지나 남은 양을 모름' }, h('span', { class: 'wn' }, winName(w)), '리셋됨')
        return h('span', { class: 'win' + (left < LOW ? ' low' : ''), title: w.resets ? '리셋 ' + clock(w.resets) : null },
          h('span', { class: 'wn' }, winName(w)),
          h('span', { class: 'bar', 'aria-hidden': 'true' }, h('i', { style: `width:${left}%` })),
          h('b', { class: 'num' }, left + '%'),
          w.resets ? h('span', { class: 'wn' }, until(w.resets)) : null)
      }),
      h('span', { class: 'ago num' }, e.state === 'stale' ? '갱신 안 됨, ' + ago(e.at) : '갱신 ' + ago(e.at)))
  }), tokTotal())
}
// every listed session summed; the split by engine and the left out cache reads are in the tooltip
function tokTotal() {
  const rows = withTokens()
  if (!rows.length) return null
  const by = {}
  let read = 0
  for (const a of rows) { by[a.tokens.engine] = (by[a.tokens.engine] || 0) + a.tokens.total; read += a.tokens.cacheRead || 0 }
  const sum = Object.values(by).reduce((x, y) => x + y, 0)
  return h('span', { class: 'use', title: `${TOK_DEF}. 목록의 세션 ${rows.length}개 합. ` + Object.entries(by).map(([k, v]) => `${ENGINE[k] || k} ${tok(v)}`).join(', ') + `. 넣지 않은 캐시 읽기 ${tok(read)}` },
    h('b', {}, '처리 토큰'), h('span', { class: 'win' }, h('span', { class: 'wn' }, '합계'), h('b', { class: 'num' }, tok(sum))))
}

async function pollUsage() {
  try { usage = await getJSON('/api/usage') } catch (err) {}   // keep the last reading; its age keeps growing
  renderUsage()
}

/* ---------- dev occupancy ---------- */
const devBar = document.getElementById('dev')
const DEV_KIND = { run: '', restart: '재기동 예정', deploy: '배포' }
let dev = null, devOpen = store.get('devOpen', false)
const elapsed = ms => !ms ? '' : ms > Date.now() ? until(ms) : span(ms) === '방금' ? '방금' : span(ms) + '째'
function devItem(i) {
  const kind = DEV_KIND[i.kind] ?? i.kind
  return h('div', {
    class: 'devi ' + (i.kind || ''),
    title: [kind || '실행', i.sinceAt ? '시작 ' + clock(i.sinceAt) : i.since, i.until ? '끝 ' + (i.untilAt ? clock(i.untilAt) : i.until) : '', i.note].filter(Boolean).join(', ')
  }, kind ? h('span', { class: 'kd' }, kind) : null, h('b', {}, i.who || '?'), h('span', { class: 'dw' }, i.what), h('span', { class: 'num' }, elapsed(i.sinceAt)))
}
// a missing or broken file hides the line; the reason stays in /api/dev and the hidden line's title
function renderDev() {
  const d = dev
  devBar.hidden = !d || d.state === 'missing' || d.state === 'broken'
  devBar.title = d?.error ? 'dev-occupancy.json: ' + d.error : ''
  if (!cur && page === 'status') renderStatus()   // the reason for a hidden line shows in the status header
  if (devBar.hidden) return put(devBar)
  const items = d.items, many = items.length > 1
  devBar.className = d.state
  put(devBar, h('b', {}, 'dev:'),
    h('div', { class: 'devl' }, items.length ? (devOpen ? items : items.slice(0, 1)).map(devItem) : h('div', { class: 'devi' }, '쓰는 세션 없음')),
    many ? h('button', {
      class: 'more', 'aria-expanded': String(devOpen),
      onclick() { devOpen = !devOpen; store.set('devOpen', devOpen); renderDev() }
    }, devOpen ? '접기' : `${items.length}건 펼치기`) : null,
    d.state === 'stale' ? h('span', { class: 'ago', title: d.updatedAt ? '갱신 ' + clock(d.updatedAt) : 'updated_at 없음' }, d.updatedAt ? '갱신 ' + ago(d.updatedAt) : '갱신 시각 없음') : null)
}
async function pollDev() {
  try { dev = await getJSON('/api/dev') } catch (err) {}   // keep the last answer
  renderDev()
}

/* ---------- routing & polling ---------- */
function route() {
  const m = location.hash.match(/^#\/s\/([\w-]+)(\/logs)?/)
  if (m) return showDetail(m[1], m[2] ? 'logs' : 'chat')
  cur = null
  page = { '#/decisions': 'decisions', '#/status': 'status', '#/flow': 'flow', '#/todo': 'todo' }[location.hash] || 'agents'
  renderTop(); renderPage()
}
function renderPage() {
  if (page === 'decisions') renderDecisions()
  else if (page === 'status') { renderStatus(); pollStatus() }
  else if (page === 'flow') { renderFlowTab(); pollMessages() }
  else if (page === 'todo') renderTodo()
  else renderList()
}

async function pollAgents() {
  try { agents = (await getJSON('/api/agents')).agents; error = ''; checkBlocked(); renderUsage() }   // usage bar carries the token total
  catch (err) { error = err.message }
  if (cur) { cur.agent = agents.find(a => a.sessionId === cur.sid); renderTop(); renderDetailHead() }
  else { renderTop(); if (page === 'agents') renderList(); else if (page === 'flow') put(tokBox, tokenBars()) }
}

window.addEventListener('hashchange', route)
document.addEventListener('visibilitychange', () => { seen(); pollMessages() })
window.addEventListener('resize', () => { if (cur?.term) fitTerm(cur); else if (!cur && page === 'flow' && flow) renderFlowTab() })
Promise.all([pollAgents(), pollDecisions(), pollTodo()]).then(route)
pollUsage(); pollDev()
setInterval(pollAgents, 3000)
setInterval(pollDecisions, 3000)
setInterval(pollTodo, 3000)
setInterval(pollUsage, 3000)
setInterval(pollDev, 3000)
setInterval(pollStatus, 5000)
setInterval(pollMessages, 5000)
setInterval(pollTranscript, 2000)
setInterval(pollLogs, 3000)
</script>
</body>
</html>
